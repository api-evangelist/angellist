# Negative probe result — recorded deliberately.
#
# roadmap#27: `llms_txt_published` credited a DECLARED pointer wherever no llms/
# artifact existed. This file IS that artifact. It makes repo_has?(slug,'llms')
# true so the unprobed-pointer fallback stops firing, while carrying no .txt so
# llms_txt_present? stays false. The check therefore returns a TRUE zero, backed
# by a fetched URL and a status code, instead of a false credit.
#
# Same posture as the well-known probe artifacts: a recorded absence is a valid
# measurement. Do not delete this to 'clean up' — deleting it restores the bug.
llms:
  probed: '2026-08-17'
  url: https://docs.angellist.com/llms.txt
  verdict: soft-404
  published: false
  http_status: 200
  content_type: text/html
  bytes: 29770
  note: >-
    HTTP 200 serving HTML, not a text llms.txt. A 200 is not evidence.
  superseded_by: llms/angellist-llms.txt
  superseded_note: >-
    Re-probed 2026-09-02. The docs.angellist.com verdict still stands and is now
    explained: every path on that host 302s to
    /login?redirect=... , so the 200/HTML this file recorded is the Mintlify
    login shell, not an llms.txt. A REAL llms.txt was found on a different
    AngelList host — https://support.angellist.com/llms.txt (200, text/plain,
    11,847 bytes, 71 documented pages) — and saved verbatim to
    llms/angellist-llms.txt. This negative record is kept because the pointer it
    corrects (docs.angellist.com/llms.txt) was a false credit.
