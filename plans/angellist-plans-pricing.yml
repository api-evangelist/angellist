created: '2026-05-04'
modified: '2026-09-02'
supersedes:
  method: generated
  modified: '2026-05-04'
  reason: >-
    The previous file was a bulk-sweep scaffold that invented Free / Professional
    / Enterprise API tiers with 1,000 and 100,000 request quotas and per-minute
    rate limits. AngelList publishes none of that. Replaced 2026-09-02 with the
    pricing AngelList actually prints on its own pricing pages.
tags: [Funds, SPVs, Fund Administration, Investing, Venture Capital, Pricing]
description: >-
  AngelList's published pricing. AngelList does not sell API access as a
  metered product — the Investor Management API is a feature of the fund
  administration service, provisioned by request through portal@angellist.com,
  with no per-call price, quota or public API tier anywhere on its site. What it
  does publish, in full and without a sales gate, is the price of the underlying
  service: two venture-fund administration plans priced as a percentage of fund
  size plus an annual fee, and flat-fee SPV pricing with an itemized add-on
  list.
api_pricing:
  metered: false
  published_api_tiers: 0
  note: >-
    No API plan, quota, overage rate or price list is published. API access is
    arranged with AngelList directly.
plan_count: 3
