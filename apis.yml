  description: >-
    The AngelList Investor Management API is a GraphQL API that enables
    programmatic access to the AngelList investor portal, supporting fund
    managers and investors in managing transactions, documents, and capital
    flows. With this API, developers can inspect existing transactions for
    status and metadata, manage entities and organizations, access data rooms
    and signature files, and receive callbacks when transactions are complete.
    The API supports a full transaction lifecycle including created,
    pendingSubmission, submitted, pendingReview, pendingRevision, igo,
    confirmed, and rejected states.
  contact:
