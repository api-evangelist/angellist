  ownership_caveat: >-
    This is a genuinely deployed, OAuth-protected MCP server, but it belongs to
    Wellfound — the former AngelList Talent business, which operates as its own
    brand on its own domain with its own security.txt and its own identity
    provider (issuer https://wellfound.com). It serves recruiter application
    workflows, not AngelList's investor-management products. It is recorded here
    because wellfound.com is listed as a Website in apis.yml, and it is
    deliberately NOT wired as an AngelList MCPServer pointer.
