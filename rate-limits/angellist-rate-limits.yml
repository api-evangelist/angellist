  reason: >-
    The previous file was a bulk-sweep scaffold. It declared free / professional
    / enterprise tiers at 10, 100 and 1,000 requests per minute with monthly
    quotas, and an X-RateLimit-* header set — none of which AngelList publishes.
    It said so itself ("Defaults are scaffold values to be replaced with
    published provider limits"). Replaced 2026-09-02 with an honest zero backed
    by probes.
description: >-
  AngelList publishes no rate limits for the Investor Management API. This is a
  recorded zero, not an unchecked gap: the developer reference that would carry
  them now requires a login, the public help center contains no limits page, and
  no rate-limit response header was observed on any anonymous request to the
  production GraphQL endpoint.
