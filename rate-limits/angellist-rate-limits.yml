  note: >-
    302s to /login?redirect=%2Fdocs%2Foverview — the reference is auth-gated, so
    any limits it documents are not publicly readable.
- url: https://portal-api.angellist.com/beta
  http_status: 200
  method: POST
  note: >-
    Anonymous responses carry no X-RateLimit-*, RateLimit-* or Retry-After
    header. Only an application-level GraphQL error body was returned.
